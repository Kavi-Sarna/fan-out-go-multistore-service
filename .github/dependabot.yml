# Updates arrive as pull requests, and the pull requests run CI. That is the
# alternative to a scheduled rebuild that hopes nothing moved: everything is
# pinned, and moving a pin is a change somebody reviews.
version: 2

updates:
  # The devcontainer's features. Dependabot keeps devcontainer.json on the
  # major version and rewrites devcontainer-lock.json with the exact one.
  #
  # What this does not cover: the image digest in devcontainer.json, the
  # Docker engine version in the feature's options, and the Compose version
  # in on-create.sh. Those are bumped by hand, which is a reason to look at
  # them when the vulnerability scan or a Dependabot PR is open anyway.
  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # One pull request for a batch of action bumps, rather than one each.
    groups:
      actions:
        patterns: ["*"]

  # Go modules. The first one arrived with the YAML parser the container
  # tests read compose.yaml with.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly

  # The Dockerfile's FROM lines, tag and digest together. The build image,
  # go.mod, the Go devcontainer image, and golangci-lint must move together -
  # a test fails if the image and go.mod differ, and a Go minor bump breaks an
  # older linter and an older devcontainer toolchain. Dependabot still updates
  # one ecosystem at a time; the dependabot-sync-go workflow runs
  # ci/sync-go-version.sh on its pull requests, which rewrites those pins and
  # advances them to the latest patch of that minor (so a bump to 1.27.1
  # becomes 1.27.2 when 1.27.2 already exists).
  #
  # compose.yaml is not watched yet: it builds its one image rather than
  # pulling one. The docker-compose ecosystem joins when the first store does.
  - package-ecosystem: docker
    directory: "/infra/docker"
    schedule:
      interval: weekly
